# ============================================================
# nginx_tarot_v3.conf · v3 阿里云 nginx 配置
# 部署到：/etc/nginx/conf.d/tarot-v3.conf
# ============================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name tarot-v3.layershop.store;
    return 301 https://$server_name$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name tarot-v3.layershop.store;

    # SSL 证书（Let's Encrypt，certbot 自动续期）
    ssl_certificate /etc/letsencrypt/live/tarot-v3.layershop.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarot-v3.layershop.store/privkey.pem;

    # SSL 配置（推荐 Mozilla 中级）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers on;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 前端静态文件
    root /var/www/tarot-v3/web/dist;
    index index.html;

    # SPA fallback（所有未匹配路由返 index.html，让 React Router 处理）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传文件（如有）
    location /uploads/ {
        alias /var/www/tarot-v3/server/uploads/;
        expires 30d;
    }

    # 日志
    access_log /var/log/nginx/tarot-v3.access.log;
    error_log /var/log/nginx/tarot-v3.error.log;
}

# ============================================================
# 申请 SSL：
#   sudo certbot --nginx -d tarot-v3.layershop.store
#
# 续期：
#   sudo certbot renew --dry-run
# ============================================================