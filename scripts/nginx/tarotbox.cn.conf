# ============================================================
# /etc/nginx/sites-enabled/tarotbox.cn · 正式站
# 创建：2026-09-21 · v3.1
# 反代到端口 3003 (tarot-v3-prod)，数据库 tarot_v3.db
# ============================================================

server {
    server_name tarotbox.cn www.tarotbox.cn;

    # 后端 API 走 Node
    location /api/ {
        proxy_hide_header ETag;
        proxy_pass http://127.0.0.1:3003;
        client_max_body_size 20m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # 前端 SPA 静态文件
    root /var/www/tarot-app-v3/web/dist;
    index index.html;

    autoindex off;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 主文档不缓存
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SSL（Let's Encrypt · DNS 生效后 certbot 申请）
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tarotbox.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarotbox.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS
server {
    if ($host = tarotbox.cn) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.tarotbox.cn) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name tarotbox.cn www.tarotbox.cn;
}