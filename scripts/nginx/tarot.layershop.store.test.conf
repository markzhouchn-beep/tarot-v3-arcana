# ============================================================
# /etc/nginx/sites-enabled/tarot.layershop.store · 测试站
# 创建：2026-09-21 · v3.1
# 反代到端口 3004 (tarot-v3-test)，数据库独立
#
# 与正式站的区别：
#   - 用 sub_filter 在 HTML 顶部注入红色 TEST 横幅
#   - 反代到测试端口 3004
#   - 加 noindex 防搜索引擎收录
# ============================================================

server {
    server_name tarot.layershop.store;

    # 禁止搜索引擎收录（测试站不应被收录）
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 后端 API 走测试端口
    location /api/ {
        proxy_hide_header ETag;
        proxy_pass http://127.0.0.1:3004;
        client_max_body_size 20m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # 前端 SPA 静态文件
    root /var/www/tarot-app-v3-test/web/dist;
    index index.html;

    autoindex off;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # TEST 横幅注入（sub_filter 模块）
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        sub_filter '</head>' '<meta name="robots" content="noindex,nofollow"><style>#test-banner{position:fixed;top:0;left:0;right:0;z-index:99999;background:linear-gradient(90deg,#dc2626,#ef4444);color:#fff;text-align:center;padding:8px 12px;font-size:13px;font-weight:600;font-family:-apple-system,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3)}#test-banner small{opacity:.85;font-weight:400;margin-left:8px}</style><div id="test-banner">⚠️ 测试环境 · 数据非正式 <small>tarot.layershop.store → 39.106.162.16:3004</small></div></head>';
        sub_filter_once on;
        sub_filter_types text/html;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        sub_filter '</head>' '<meta name="robots" content="noindex,nofollow"><style>#test-banner{position:fixed;top:0;left:0;right:0;z-index:99999;background:linear-gradient(90deg,#dc2626,#ef4444);color:#fff;text-align:center;padding:8px 12px;font-size:13px;font-weight:600;font-family:-apple-system,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3)}#test-banner small{opacity:.85;font-weight:400;margin-left:8px}</style><div id="test-banner">⚠️ 测试环境 · 数据非正式 <small>tarot.layershop.store → 39.106.162.16:3004</small></div></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # SSL（复用老的 Let's Encrypt 证书）
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tarot.layershop.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarot.layershop.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = tarot.layershop.store) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name tarot.layershop.store;
}